services:
  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Not exposed to the host by default; the backend reaches it over the
    # internal network. Uncomment to inspect from the host:
    # ports:
    #   - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Backend container reaches Mongo via the internal network.
      MONGODB_URI: mongodb://db:27017/festivecook
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file next to docker-compose.yml}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Frontend origin for CORS — empty when served same-origin by this app.
      CLIENT_URL: ${CLIENT_URL:-}
    depends_on:
      - db
    volumes:
      # Persist uploaded cook verification documents across restarts.
      - uploads:/app/backend/uploads

volumes:
  mongo-data:
  uploads: